services:
  - type: web
    name: noise-analysis-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 2 backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: UPLOAD_MAX_MB
        value: "200"
    plan: free
